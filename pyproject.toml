[project]
name = "reject-bench"
version = "0.0.0"
description = "가드가 AI를 거부한 사건을 근거와 함께 기록하고, 그 판단이 얼마나 틀리는지 측정해 공개한다"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# 패키지로 설치하지 않는다 — CLI는 저장소 루트에서 `python -m rejectbench.…`로 실행한다.
package = false

[tool.pytest.ini_options]
# hooks/*.test.py는 unittest 파일이지만 같은 게이트 안에서 돈다.
testpaths = ["tests", "hooks"]
python_files = ["test_*.py", "*_test.py", "*.test.py"]
# `hooks`가 있어야 codex_handoff_gate가 continuity를 형제로 import한다.
pythonpath = [".", "hooks"]
# `*.test.py`는 모듈명에 점이 들어가 기본(prepend) 모드로는 import되지 않는다.
addopts = "-q --import-mode=importlib"
