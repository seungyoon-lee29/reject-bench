[project]
name = "reject-bench"
version = "0.0.0"
description = "지속형 가드의 발동 증거를 바탕으로 유지·수정·제거 결정을 돕는 개인 도구 실험"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# v7 구현 전의 최소 골격. 패키지와 CLI는 T1부터 새로 정의한다.
package = false

[tool.pytest.ini_options]
# hooks/*.test.py는 unittest 파일이지만 같은 게이트 안에서 돈다.
testpaths = ["tests", "hooks"]
python_files = ["test_*.py", "*_test.py", "*.test.py"]
# `hooks`가 있어야 codex_handoff_gate가 continuity를 형제로 import한다.
pythonpath = [".", "hooks"]
# `*.test.py`는 모듈명에 점이 들어가 기본(prepend) 모드로는 import되지 않는다.
addopts = "-q --import-mode=importlib"
